name: ci
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:  # tests, lint, format, types, import rules: scripts/check.sh, as before every commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: scripts/check.sh

  postgres:  # every migration runs on Postgres, as in production, and no model change lacks one
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: heydesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/heydesk  # the form Render gives
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run alembic check

  audit:  # known vulnerabilities in the dependencies the server runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv export --locked --no-dev --no-emit-project --no-hashes -o requirements.txt
      - run: uvx pip-audit -r requirements.txt --disable-pip --no-deps

  image:  # the Docker image builds and answers /health
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: heydesk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start it with the fake providers and wait for /health
        run: |
          docker run -d --name heydesk -p 8000:8000 \
            -e LLM_PROVIDER=fake -e DECIDER=fake -e EMBEDDER=fake heydesk:ci
          for _ in $(seq 30); do
            curl -fs http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs heydesk
          exit 1

  deploy:  # a merge to main goes live on Render, only after every job above passed
    needs: [check, postgres, audit, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production  # GitHub > Settings > Environments can make it wait for an approval
    steps:
      - name: Ask Render to deploy this commit
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}  # Render > the service > Settings > Deploy Hook
        run: curl -fsS -X POST "$HOOK&ref=$GITHUB_SHA" > /dev/null
      - name: Wait until /health answers from this commit
        env:
          URL: ${{ vars.RENDER_URL }}  # https://….onrender.com, a repository variable
        run: |
          for _ in $(seq 90); do  # up to 15 minutes: Render builds the image first
            if curl -fs --max-time 10 "$URL/health" | grep -q "\"commit\":\"$GITHUB_SHA\""; then
              echo "live: $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "the new version didn't answer /health; see the deploy's logs on Render"
          exit 1
