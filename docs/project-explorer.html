<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HeyDesk Explorer</title>
<!--
  HeyDesk project explorer: an interactive, visual map of the codebase.
  Data lives in <script type="application/json" id="data-*"> blocks; the views render from them.
  Every block and every view is wrapped in grep-able START / END markers named SECTION:<id>.
  Find one:  grep -n "SECTION:<id>" docs/project-explorer.html
  Which section reflects which source files: docs/project-explorer.index.md
-->
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<!-- SECTION:view-styles START -->
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --soft: #eeece6; --ink: #1c1c1a; --muted: #6b685f; --line: #dad6cc;
  --accent: #0f766e; --accent-soft: #d8efeb; --warn: #c2410c; --warn-soft: #fdebdf; --fail: #dc2626;
  --t-client: #7c3aed; --t-api: #2563eb; --t-service: #0d9488; --t-agent: #d97706; --t-tool: #ca8a04;
  --t-core: #9a3412; --t-port: #64748b; --t-adapter: #db2777; --t-external: #0891b2; --t-store: #475569;
  --o-platform: #fde3e3; --o-desk: #fdf1d6; --o-owner: #dcf3e2; --o-python: #dde8fb; --o-adapter: #ebe1fb; --o-external: #e4f4f7;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
:root[data-theme="dark"] {
  --bg: #121211; --panel: #1c1c1a; --soft: #262622; --ink: #ecebe5; --muted: #a39f95; --line: #3a3934;
  --accent: #2dd4bf; --accent-soft: #11332f; --warn: #fb923c; --warn-soft: #3a2414; --fail: #f87171;
  --t-client: #a78bfa; --t-api: #60a5fa; --t-service: #2dd4bf; --t-agent: #fbbf24; --t-tool: #facc15;
  --t-core: #fb923c; --t-port: #94a3b8; --t-adapter: #f472b6; --t-external: #22d3ee; --t-store: #94a3b8;
  --o-platform: #3d2121; --o-desk: #3a3020; --o-owner: #1b3323; --o-python: #1b2a40; --o-adapter: #2c2240; --o-external: #14313a;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 30; background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 16px 0; }
.brand { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand h1 { font-size: 17px; margin: 0; }
.brand .sub { color: var(--muted); font-size: 12.5px; }
.brand .spacer { flex: 1; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 6px; }
nav.tabs a { padding: 6px 11px; color: var(--muted); text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap; font-weight: 500; font-size: 13.5px; }
nav.tabs a.on { color: var(--ink); border-bottom-color: var(--accent); }
main { padding: 12px 16px 40px; }
.view { display: none; }
.view.on { display: block; }
.hint { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
h2 { font-size: 17px; margin: 0 0 4px; }
h3 { font-size: 15px; margin: 12px 0 6px; }
code, .mono { font-family: var(--mono); font-size: 12px; }
code { background: var(--soft); padding: 1px 4px; border-radius: 4px; }
pre { font-family: var(--mono); font-size: 12px; background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; overflow-x: auto; white-space: pre-wrap; margin: 6px 0; max-height: 360px; }
button { font: inherit; cursor: pointer; color: var(--ink); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 4px 11px; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.chip { display: inline-block; border: 1px solid var(--line); background: var(--soft); border-radius: 999px; padding: 0 8px; font-size: 12px; margin: 2px 3px 2px 0; text-decoration: none; color: var(--ink); }
button.chip:hover { border-color: var(--accent); }
.chip.file { font-family: var(--mono); font-size: 11px; border-radius: 5px; background: var(--panel); }
.badge-uv { display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: .04em; color: var(--warn); border: 1.5px dashed var(--warn); border-radius: 4px; padding: 0 4px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; align-items: start; }
.stage { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; height: calc(100vh - 190px); min-height: 460px; overflow: hidden; }
.stage .cy { position: absolute; inset: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; max-height: calc(100vh - 150px); overflow-y: auto; position: sticky; top: 96px; }
.panel h3 { margin-top: 0; }
.panel .empty { color: var(--muted); font-size: 13px; }
.kv { display: grid; grid-template-columns: 76px 1fr; gap: 3px 8px; font-size: 13px; margin: 6px 0; }
.kv > div:nth-child(odd) { color: var(--muted); }
.toolbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 4px 0 8px; }
.toolbar input[type=search], .toolbar select { font: inherit; font-size: 13px; padding: 4px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); }
.typechip { border: 1.5px solid var(--tc); background: var(--panel); border-radius: 999px; padding: 1px 9px; font-size: 12px; }
.typechip.off { opacity: .35; text-decoration: line-through; }
.typechip i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: var(--tc); margin-right: 5px; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); font-family: var(--mono); font-size: 11px; padding: 3px 7px; border-radius: 5px; display: none; }
.caption { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px; padding: 8px 12px; margin: 8px 0; min-height: 64px; }
.caption .n { font-family: var(--mono); color: var(--muted); font-size: 12px; }
.steps { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.steps button { font-size: 11.5px; font-family: var(--mono); border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 1px 6px; }
.steps button.now { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.steps button.done { border-color: var(--accent); }
.quizbar { display: none; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 10px; padding: 6px 12px; margin-bottom: 8px; font-size: 13px; align-items: center; gap: 10px; }
.quizbar.on { display: flex; }
.quizbar b { color: var(--accent); }
/* prompt simulator */
.psim { display: grid; grid-template-columns: 270px minmax(0, 1fr) 320px; gap: 12px; align-items: start; }
.ctl { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; position: sticky; top: 96px; max-height: calc(100vh - 110px); overflow-y: auto; }
.ctl label { display: flex; gap: 7px; align-items: flex-start; font-size: 13px; margin: 5px 0; }
.ctl select { width: 100%; font: inherit; font-size: 13px; padding: 3px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.ctl .grp { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-top: 10px; }
.frag { border: 1.5px solid var(--line); border-radius: 10px; margin-bottom: 6px; transition: opacity .2s, transform .2s, box-shadow .2s; }
.frag > .fh { padding: 6px 10px; display: flex; gap: 8px; align-items: center; cursor: pointer; border-radius: 9px; }
.frag > .fb { display: none; padding: 6px 10px 8px; border-top: 1px solid var(--line); background: var(--panel); border-radius: 0 0 9px 9px; }
.frag.open > .fb { display: block; }
.frag.in { box-shadow: 0 0 0 2px var(--accent); }
.frag.out { opacity: .38; border-style: dashed; }
.frag.flash { transform: scale(1.01); }
.frag .ord { font-family: var(--mono); font-weight: 700; min-width: 22px; text-align: center; border-radius: 5px; background: var(--accent); color: var(--bg); font-size: 11.5px; }
.frag.out .ord { background: var(--line); color: var(--muted); }
.frag .why { margin-left: auto; font-size: 11.5px; color: var(--muted); text-align: right; }
.own-platform { background: var(--o-platform); } .own-desk { background: var(--o-desk); } .own-owner { background: var(--o-owner); }
.own-python { background: var(--o-python); } .own-adapter { background: var(--o-adapter); } .own-external { background: var(--o-external); }
.order li { font-size: 13px; margin: 2px 0; }
table.vars { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.vars td, table.vars th { border: 1px solid var(--line); padding: 3px 6px; text-align: left; vertical-align: top; }
table.vars th { background: var(--soft); }
/* mermaid */
.mm { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; overflow: auto; }
.mm svg { max-width: 100%; height: auto; }
.mm g.node, .mm g.nodes g { cursor: pointer; }
.mm g.node.picked rect, .mm g.node.picked polygon, .mm g.node.picked circle { stroke: var(--accent) !important; stroke-width: 3px !important; }
/* cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.card.hl { box-shadow: 0 0 0 3px var(--accent); }
.card h3 { margin: 0; }
.card .lines { font-size: 13px; margin: 0; padding-left: 16px; }
.card .mm { padding: 4px; min-height: 90px; }
.card .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
.q { cursor: pointer; }
.q:hover { border-color: var(--accent); }
.q .num { font-family: var(--mono); color: var(--muted); font-size: 12px; }
.q .a { font-size: 13px; color: var(--muted); }
table.grid { border-collapse: collapse; width: 100%; font-size: 13px; background: var(--panel); }
table.grid th, table.grid td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
table.grid th { background: var(--soft); }
tr.hl td { background: var(--accent-soft); }
.sev { font-weight: 700; font-size: 12px; }
.sev.high { color: var(--fail); } .sev.med { color: var(--warn); } .sev.low { color: var(--muted); }
/* how the agent works */
.af-nav { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 4px; }
.af-nav .btn b { font-family: var(--mono); margin-right: 4px; color: var(--accent); }
.af-nav .btn.on b { color: inherit; }
.af-sec { margin: 18px 0 6px; }
.af-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; }
.af-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.af-box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; font-size: 13px; min-width: 0; }
.af-box h3 { margin: 0 0 3px; }
.af-box ul { margin: 4px 0 0; padding-left: 17px; }
.af-box li { margin: 3px 0; }
.af-call { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 10px; padding: 8px 12px; margin: 8px 0; font-size: 14px; }
.af-road { display: flex; align-items: stretch; flex-wrap: wrap; gap: 3px; margin: 8px 0; }
.af-stop { flex: 1 1 118px; display: block; text-align: left; background: var(--panel); border: 1.5px solid var(--line); border-top: 4px solid var(--accent); border-radius: 9px; padding: 7px 9px; font-size: 12.5px; }
.af-stop:hover { border-color: var(--accent); }
.af-stop b { display: block; font-size: 14px; }
.af-stop small { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: 3px; }
.af-arrow { align-self: center; color: var(--muted); font-size: 15px; }
.af-src { --c: var(--muted); }
.af-src-url { --c: var(--t-client); } .af-src-body { --c: var(--t-api); } .af-src-socket { --c: var(--t-port); } .af-src-db { --c: var(--t-external); }
.af-src-env { --c: var(--t-adapter); } .af-src-code { --c: var(--t-tool); } .af-src-clock { --c: var(--t-core); } .af-src-run { --c: var(--t-service); }
.af-chip { border: 1.5px solid var(--c); background: var(--panel); border-radius: 999px; padding: 1px 10px; font-size: 12px; }
.af-chip.on { background: var(--c); color: var(--bg); }
.af-chip i, .af-pr i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: var(--c); margin-right: 5px; }
.af-chip.on i { background: var(--bg); }
.af-stage { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 8px 11px; }
.af-stage h3 { margin: 0; }
.af-down { text-align: center; color: var(--muted); font-size: 17px; line-height: 1.3; }
.af-pr { display: grid; grid-template-columns: minmax(130px, 170px) minmax(110px, 170px) minmax(0, 1fr); gap: 8px; padding: 3px 5px; border-top: 1px solid var(--line); font-size: 12.5px; align-items: baseline; }
.af-pr .nm { font-family: var(--mono); font-weight: 600; overflow-wrap: anywhere; }
.af-pr .eg { font-family: var(--mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.af-pr.dim { opacity: .2; }
.af-gate { display: grid; grid-template-columns: 34px minmax(0, 1.5fr) 26px minmax(0, 1fr); gap: 6px; align-items: stretch; margin-bottom: 6px; }
.af-gate .no { display: flex; align-items: center; justify-content: center; border-radius: 8px; background: var(--soft); font-family: var(--mono); font-weight: 700; font-size: 12px; }
.af-gate .out { border-radius: 9px; padding: 6px 10px; font-size: 12.5px; border: 1.5px solid var(--line); }
.af-gate.stop .out { border-color: var(--fail); background: var(--warn-soft); }
.af-gate.divert .out { border-color: var(--t-service); background: var(--accent-soft); }
.af-gate.soft .out { border-color: var(--t-agent); background: var(--o-desk); }
.af-gate .arr { align-self: center; text-align: center; color: var(--muted); }
.af-who { font-size: 10.5px; font-weight: 700; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 5px; }
.af-group { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); margin: 14px 0 6px; }
.af-k { --kc: var(--muted); }
.af-k-route { --kc: var(--t-api); } .af-k-check { --kc: var(--fail); } .af-k-read { --kc: var(--t-external); } .af-k-write { --kc: var(--t-adapter); }
.af-k-build { --kc: var(--t-service); } .af-k-model { --kc: var(--t-agent); } .af-k-tool { --kc: var(--t-tool); } .af-k-net { --kc: var(--t-port); } .af-k-stream { --kc: var(--t-client); }
.af-kind { display: inline-block; flex: none; min-width: 74px; text-align: center; border-radius: 5px; color: var(--bg); background: var(--kc); font-size: 10.5px; font-weight: 700; padding: 1px 5px; }
.af-kchip { border: 1.5px solid var(--kc); background: var(--panel); border-radius: 999px; padding: 1px 10px; font-size: 12px; }
.af-kchip.on { background: var(--kc); color: var(--bg); }
.af-step { margin-left: calc(var(--d) * 22px); border-left: 3px solid var(--kc); background: var(--panel); border-radius: 0 8px 8px 0; margin-bottom: 3px; }
.af-step summary { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; padding: 4px 9px; cursor: pointer; font-size: 13px; }
.af-step summary code { font-weight: 600; background: none; padding: 0; font-size: 12.5px; }
.af-step summary .does { color: var(--muted); font-size: 12.5px; }
.af-step .inner { padding: 2px 10px 8px; font-size: 13px; border-top: 1px solid var(--line); }
.af-step.dim { opacity: .18; }
.af-db { display: block; margin: 5px 0; font-family: var(--mono); font-size: 11.5px; background: var(--o-external); border-radius: 6px; padding: 3px 7px; }
.af-play { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; align-items: start; }
.af-lanes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px; max-height: calc(100vh - 260px); min-height: 380px; overflow-y: auto; align-content: start; }
.af-lane { position: sticky; top: -8px; z-index: 2; text-align: center; font-weight: 700; font-size: 12px; background: var(--soft); padding: 4px; border-radius: 6px; }
.af-turn { grid-column: 1 / -1; text-align: center; font-size: 11.5px; font-weight: 700; color: var(--accent); border-top: 1px dashed var(--line); padding-top: 5px; margin-top: 4px; }
.af-bar { font-size: 12px; line-height: 1.3; text-align: left; border: 1.5px solid var(--line); border-radius: 8px; background: var(--bg); padding: 3px 7px; overflow-wrap: anywhere; }
.af-bar.now { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }
.af-bar .dir { font-family: var(--mono); color: var(--accent); margin-right: 4px; }
.af-msg { font-family: var(--mono); font-size: 11.5px; border-bottom: 1px solid var(--line); padding: 2px 0; overflow-wrap: anywhere; }
.af-life { display: flex; flex-wrap: wrap; gap: 6px; }
.af-life > div { flex: 1 1 145px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 6px 9px; font-size: 12.5px; }
.af-life b { display: block; }
.af-life .num { font-family: var(--mono); color: var(--accent); font-size: 11.5px; }
.af-route { display: grid; grid-template-columns: 110px 24px 170px minmax(0, 1fr); gap: 6px; align-items: baseline; padding: 4px 6px; border-top: 1px solid var(--line); font-size: 13px; }
.af-route .fld { font-family: var(--mono); font-weight: 600; font-size: 12px; }
.af-matrix td, .af-matrix th { text-align: center; }
.af-matrix td:first-child, .af-matrix th:first-child { text-align: left; font-family: var(--mono); font-size: 12px; }
.af-cell { display: inline-block; min-width: 36px; font-size: 11px; font-weight: 700; font-family: var(--mono); border: 0; border-radius: 5px; color: var(--bg); padding: 2px 6px; }
.af-cell.R { background: var(--t-external); } .af-cell.W { background: var(--t-adapter); } .af-cell.RW { background: var(--t-agent); }
.af-cell.pick { outline: 3px solid var(--accent); outline-offset: 1px; }
@media (max-width: 1100px) {
  .layout, .psim, .af-play { grid-template-columns: 1fr; }
  .panel, .ctl { position: static; max-height: none; }
  .af-two { grid-template-columns: 1fr; }
  .af-step { margin-left: calc(var(--d) * 9px); }
  .af-pr { grid-template-columns: 1fr 1fr; }
  .af-pr > :last-child { grid-column: 1 / -1; }
  .af-gate { grid-template-columns: 26px minmax(0, 1fr); }
  .af-gate .arr { display: none; }
  .af-gate .out { grid-column: 2; }
  .af-route { grid-template-columns: 90px minmax(0, 1fr); }
  .af-route .a { display: none; }
  .af-route > :last-child { grid-column: 1 / -1; }
  .af-lanes { max-height: none; }
}
</style>
<!-- SECTION:view-styles END -->
</head>
<body>
<!-- SECTION:view-shell-markup START -->
<header>
  <div class="brand">
    <h1>HeyDesk Explorer</h1>
    <span class="sub">Click anything. Every node and panel names its source file.</span>
    <span class="spacer"></span>
    <button class="btn" id="theme" title="Light / dark">◐ Theme</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main>
  <div class="quizbar" id="quizbar"><b>Quiz</b><span id="quizq"></span><span class="spacer" style="flex:1"></span><button class="btn" id="quizback">← Back to quiz</button></div>
  <section class="view" id="v-howitworks"></section>
  <section class="view" id="v-map"></section>
  <section class="view" id="v-flows"></section>
  <section class="view" id="v-agents"></section>
  <section class="view" id="v-prompts"></section>
  <section class="view" id="v-triggers"></section>
  <section class="view" id="v-state"></section>
  <section class="view" id="v-solved"></section>
  <section class="view" id="v-quiz"></section>
  <section class="view" id="v-findings"></section>
</main>
<div class="tip" id="tip"></div>
<!-- SECTION:view-shell-markup END -->

<!-- SECTION:data-modules START -->
<!-- every module, external service and storage node, and the edges between them -->
<script type="application/json" id="data-modules">
{
 "types": [
  {
   "id": "client",
   "label": "Clients"
  },
  {
   "id": "api",
   "label": "HTTP API"
  },
  {
   "id": "service",
   "label": "Services"
  },
  {
   "id": "agent",
   "label": "Agents"
  },
  {
   "id": "tool",
   "label": "Tools"
  },
  {
   "id": "core",
   "label": "Core / runtime"
  },
  {
   "id": "port",
   "label": "Ports"
  },
  {
   "id": "adapter",
   "label": "Adapters"
  },
  {
   "id": "external",
   "label": "External services"

<script>
// Shared helpers, the tab router and the theme. Views register in VIEWS and render from data-* blocks.
const DATA = id => JSON.parse(document.getElementById("data-" + id).textContent);
const M = DATA("modules"), AG = DATA("agents"), TL = DATA("tools"), PR = DATA("prompts"),
  TR = DATA("triggers"), FL = DATA("flows"), ST = DATA("state"), SO = DATA("solutions"),
  QZ = DATA("quiz"), FD = DATA("findings");
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
const file = f => f ? `<span class="chip file" title="source file">📄 ${esc(f)}</span>` : "";
const uv = x => x && x.unverified ? ` <span class="badge-uv" title="${esc(x.unverified === true ? "Not confirmable from this repo's code" : x.unverified)}">UNVERIFIED</span>` : "";
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const TYPES = M.types;  // [{id, label}] in layer order
const typeColor = t => css("--t-" + t) || "#888";

// Every node of the system: modules + agents + tools, by id
const NODES = {};
for (const n of M.nodes) NODES[n.id] = n;
for (const a of AG.agents) NODES[a.id] = { ...a, type: "agent" };
for (const t of TL.tools) NODES[t.id] = { ...t, type: "tool", label: t.name, purpose: t.purpose };
const label = id => (NODES[id] && (NODES[id].label || NODES[id].name)) || id;

const VIEWS = [];
let current = null;
function register(v) { VIEWS.push(v); }
function go(view, arg) {  // pushState, not location.hash: works when the file is opened as file:// or data:
  const url = "#" + view + (arg ? "/" + encodeURIComponent(JSON.stringify(arg)) : "");
  try { history.pushState(null, "", url); } catch { location.hash = url; return; }
  route();
}
function route() {
  const [name, raw] = location.hash.slice(1).split("/");
  const v = VIEWS.find(x => x.id === name) || VIEWS[0];
  let arg = null;
  try { arg = raw ? JSON.parse(decodeURIComponent(raw)) : null; } catch { arg = null; }
  $$("nav.tabs a").forEach(a => a.classList.toggle("on", a.dataset.v === v.id));
  $$(".view").forEach(s => s.classList.toggle("on", s.id === "v-" + v.id));
  if (!arg || !arg.quiz) $("#quizbar").classList.remove("on");
  if (!v.ready) { v.init(); v.ready = true; }
  current = v;
  v.show && v.show(arg || {});
  if (arg && arg.quiz != null) {
    const q = QZ.questions[arg.quiz];
    $("#quizq").innerHTML = `<b>Q${arg.quiz + 1}.</b> ${fmt(q.q)} <span style="color:var(--muted)">— ${fmt(q.a)}</span>`;
    $("#quizbar").classList.add("on");
  }
}
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("heydesk-explorer-theme", t); } catch {}
  mermaid.initialize({ startOnLoad: false, theme: t === "dark" ? "dark" : "default", securityLevel: "loose", flowchart: { htmlLabels: true } });
  for (const v of VIEWS) if (v.ready && v.onTheme) v.onTheme();
}
let mmCount = 0;
async function drawMermaid(el, text) {
  try {
    const { svg, bindFunctions } = await mermaid.render("mm" + (++mmCount), text);
    el.innerHTML = svg;
    bindFunctions && bindFunctions(el);
  } catch (e) {
    el.innerHTML = `<pre>Diagram error: ${esc(e.message || e)}</pre>`;
    console.warn("mermaid", e, text);
  }
}
const mq = s => String(s).replace(/"/g, "'").replace(/[;#]/g, ",").replace(/[<>]/g, "");  // safe in a Mermaid label
const tip = $("#tip");
function showTip(text, ev) { tip.textContent = text; tip.style.display = "block"; tip.style.left = ev.clientX + 12 + "px"; tip.style.top = ev.clientY + 12 + "px"; }
function hideTip() { tip.style.display = "none"; }
function cyBaseStyle() {
  return [
    { selector: "node", style: {
      "shape": "round-rectangle", "background-color": css("--panel"), "border-width": 2, "border-color": "data(color)",
      "label": "data(text)", "color": css("--ink"), "font-size": 10, "text-wrap": "wrap", "text-max-width": "data(w)",
      "text-valign": "center", "text-halign": "center", "width": "data(w)", "height": "data(h)", "transition-property": "opacity, border-width", "transition-duration": "150ms" } },
    { selector: "node.uv", style: { "border-style": "dashed", "border-color": css("--warn") } },
    { selector: "edge", style: {
      "width": 1.3, "line-color": css("--line"), "target-arrow-color": css("--line"), "target-arrow-shape": "triangle",
      "curve-style": "bezier", "arrow-scale": 0.8, "font-size": 8.5, "color": css("--muted"), "text-rotation": "autorotate",
      "transition-property": "line-color, width, opacity", "transition-duration": "200ms" } },
    { selector: "edge.dashed", style: { "line-style": "dashed" } },
    { selector: ".faded", style: { "opacity": 0.12 } },
    { selector: "node.lit", style: { "border-width": 3.5 } },
    { selector: "edge.lit", style: { "line-color": css("--accent"), "target-arrow-color": css("--accent"), "width": 2.4, "label": "data(label)", "opacity": 1 } },
    { selector: "node.pick", style: { "background-color": "data(color)", "color": css("--bg"), "border-width": 4 } },
    { selector: "node.hl", style: { "border-width": 5, "border-color": css("--accent"), "background-color": css("--accent-soft") } },
  ];
}
function nodeEl(id, extra = {}) {
  const n = NODES[id] || { id, label: id, type: "core" };
  const text = (n.label || n.name || id) + (n.unverified ? "\n⚠ UNVERIFIED" : "");
  const lines = text.split("\n").reduce((k, l) => k + Math.max(1, Math.ceil(l.length / 20)), 0);
  const w = Math.min(130, Math.max(60, Math.max(...text.split("\n").map(l => l.length)) * 5.8 + 14));
  return { data: { id, text, color: typeColor(n.type), w, h: 14 + lines * 12, type: n.type, ...extra }, classes: n.unverified ? "uv" : "" };
}

<script>
// 0. How the agent works: a guided walk through one message. One function per chapter, all from data-agent-flow.
register({
  id: "howitworks", label: "How the agent works",
  init() {
    this.AF = DATA("agent-flow");
    $("#v-howitworks").innerHTML = `<div class="af-nav" id="af-nav"></div><p class="hint" id="af-blurb"></p><div id="af-body"></div>`;
    $("#af-nav").innerHTML = this.AF.chapters.map((c, i) => `<button class="btn" data-ch="${c.id}"><b>${i + 1}</b>${esc(c.title)}</button>`).join("");
    $("#af-nav").onclick = e => { const b = e.target.closest("[data-ch]"); if (b) go("howitworks", { ch: b.dataset.ch }); };
    $("#af-body").onclick = e => { const b = e.target.closest("[data-go]"); if (b) go("howitworks", { ch: b.dataset.go }); };
  },
  show(arg) {  // the same chapter again keeps its place: a replay's step, an opened line
    const id = arg.ch || this.ch || "big";
    if (id !== this.ch) this.open(id);
  },
  onTheme() { this.open(this.ch); },
  open(id) {
    const c = this.AF.chapters.find(x => x.id === id) || this.AF.chapters[0];
    this.ch = c.id;
    clearInterval(this.timer);
    $$("#af-nav .btn").forEach(b => b.classList.toggle("on", b.dataset.ch === c.id));
    $("#af-blurb").textContent = c.blurb;
    this[c.id]($("#af-body"));
  },
  async chart(mmEl, panelEl, data) {  // a clickable Mermaid flowchart, as on the Triggers tab
    const key = {}; data.nodes.forEach((n, i) => { key[n.id] = "n" + i; });
    const shape = n => { const t = mq(n.label); return { event: `>"${t}"]`, end: `(["${t}"])` }[n.shape] || `["${t}"]`; };
    let text = "flowchart TD\n";
    for (const n of data.nodes) text += `  ${key[n.id]}${shape(n)}\n`;
    for (const [a, b, l] of data.edges) text += `  ${key[a]} -->${l ? `|"${mq(l)}"|` : ""} ${key[b]}\n`;
    await drawMermaid(mmEl, text);
    const pick = id => {
      const n = data.nodes.find(x => x.id === id);
      $$("g.node", mmEl).forEach(g => g.classList.toggle("picked", g.dataset.n === id));
      panelEl.innerHTML = `<h3>${esc(n.label)}</h3><p>${fmt(n.note)}</p>${file(n.file)}<span class="chip file">ƒ ${esc(n.fn)}</span>${n.code ? `<pre>${esc(n.code)}</pre>` : ""}`;
    };
    const back = Object.fromEntries(Object.entries(key).map(([a, b]) => [b, a]));
    $$("g.node", mmEl).forEach(g => {
      const m = g.id.match(/^flowchart-(n\d+)-\d+$/); if (!m) return;
      g.dataset.n = back[m[1]];
      g.addEventListener("click", () => pick(g.dataset.n));
    });
    pick("start");
  },

  big(el) {
    const A = this.AF;
    const road = A.stations.map((s, i) => `${i ? `<span class="af-arrow">→</span>` : ""}<button class="af-stop" data-go="${s.ch}"><b>${esc(s.name)}</b>${esc(s.does)}<small>${esc(s.fn)}</small></button>`).join("");
    el.innerHTML = `
      <div class="af-call"><b>In one sentence:</b> a message comes in at a route, <code>start_turn()</code> checks it and packs a <code>TurnInput</code>, <code>run_turn()</code> talks to the model and runs tools until there's a reply, and <code>_save()</code> writes down what happened.</div>
      <h3 class="af-sec">The journey of one message <span class="hint">(click a stop to go deeper)</span></h3>
      <div class="af-road">${road}</div>
      <h3 class="af-sec">Three ideas that make the code make sense</h3>
      <div class="af-grid">${A.ideas.map(i => `<div class="af-box"><h3>${esc(i.title)}</h3><p style="margin:3px 0">${fmt(i.text)}</p><pre>${esc(i.code)}</pre></div>`).join("")}</div>
      <h3 class="af-sec">What exists all the time, and what's made for each message</h3>
      <div class="af-two">
        <div class="af-box"><h3>Built once, when the server starts</h3><ul>${A.once.map(x => `<li><b>${fmt(x.what)}</b><br>${fmt(x.where)}</li>`).join("")}</ul></div>
        <div class="af-box"><h3>Built again for every message</h3><ul>${A.each.map(x => `<li><b>${fmt(x.what)}</b><br>${fmt(x.where)}</li>`).join("")}</ul></div>
      </div>
      <h3 class="af-sec">The words used everywhere</h3>
      <div class="af-grid">${A.words.map(w => `<div class="af-box"><b>${esc(w.w)}</b><br>${fmt(w.m)}<br>${file(w.f)}</div>`).join("")}</div>`;
  },

  doors(el) {
    el.innerHTML = `<p class="hint">${fmt(this.AF.doors.summary)}</p><div class="layout"><div class="mm" id="af-mm"></div><div class="panel" id="af-panel"></div></div>`;
    this.chart($("#af-mm"), $("#af-panel"), this.AF.doors);
  },

  params(el) {
    const A = this.AF;
    const stage = s => `<div class="af-stage"><h3>${esc(s.title)}</h3><span class="chip file">ƒ ${esc(s.fn)}</span>${file(s.file)}<p class="hint" style="margin:3px 0">${fmt(s.note)}</p>
      ${s.rows.map(r => `<div class="af-pr af-src af-src-${r.src}" data-src="${r.src}"><span class="nm"><i></i>${esc(r.name)}</span><span class="eg">${esc(r.eg)}</span><span>${fmt(r.from)}</span></div>`).join("")}</div>`;
    const T = A.channelTable;
    el.innerHTML = `
      <div class="toolbar"><b style="font-size:13px">Where it comes from:</b> ${A.sources.map(s => `<button class="af-chip af-src af-src-${s.id}" data-s="${s.id}"><i></i>${esc(s.label)}</button>`).join("")}</div>
      <p class="hint">Click a source to light up every value that comes from it. Read downward: each stage is built from the ones above it. The prompt's own pieces are on the <a href="#prompts">Prompt simulator</a>.</p>
      ${A.stages.map(stage).join(`<div class="af-down">↓</div>`)}
      <h3 class="af-sec">The same <code>start_turn</code>, called from each channel</h3>
      <table class="grid"><tr>${T.cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr>${T.rows.map(r => `<tr>${r.map((c, i) => `<td>${i ? fmt(c) : `<code>${esc(c)}</code>`}</td>`).join("")}</tr>`).join("")}</table>`;
    let on = null;
    $(".toolbar", el).onclick = e => {
      const b = e.target.closest("[data-s]"); if (!b) return;
      on = on === b.dataset.s ? null : b.dataset.s;
      $$("[data-s]", el).forEach(x => x.classList.toggle("on", x.dataset.s === on));
      $$(".af-pr", el).forEach(r => r.classList.toggle("dim", !!on && r.dataset.src !== on));
    };
  },

  checks(el) {
    let n = 0;
    const WHO = { web: "web only", apps: "messaging apps", all: "" };
    const row = g => {
      if (g.group) return `<div class="af-group">${esc(g.group)}</div>`;
      n += 1;
      return `<div class="af-gate ${g.kind}"><div class="no">${n}</div>
        <div class="af-box"><b>${esc(g.name)}</b>${WHO[g.who] ? `<span class="af-who">${WHO[g.who]}</span>` : ""}<br>${fmt(g.rule)}<br><span class="chip file">ƒ ${esc(g.fn)}</span>${file(g.file)}<span class="chip">kept in: ${fmt(g.kept)}</span></div>
        <div class="arr">→</div><div class="out">${fmt(g.fail)}</div></div>`;
    };
    el.innerHTML = `
      <div class="toolbar"><span class="chip" style="border-color:var(--fail)">Red: stops the message, no model call</span><span class="chip" style="border-color:var(--t-service)">Green: goes to the team instead</span><span class="chip" style="border-color:var(--t-agent)">Amber: the turn goes on, or it ends politely</span></div>
      ${this.AF.gates.map(row).join("")}
      <p class="hint">Limits are set in <code>config.py</code> and <code>services/rate_limits.py</code>. All of these numbers can be changed there.</p>`;
  },

  trace(el) {
    const A = this.AF;
    const step = (s, i) => `<details class="af-step af-k af-k-${s.k}" data-k="${s.k}" style="--d:${s.d}"><summary><span class="af-kind">${esc(A.kinds.find(k => k.id === s.k).label)}</span><code>${esc(s.fn)}</code><span class="does">${fmt(s.does)}</span></summary>
      <div class="inner">${s.note ? `<p style="margin:5px 0">${fmt(s.note)}</p>` : ""}${s.db ? `<span class="af-db">🗄 ${esc(s.db)}</span>` : ""}${file(s.file)}${s.code ? `<pre>${esc(s.code)}</pre>` : ""}</div></details>`;
    el.innerHTML = `
      <div class="toolbar"><button class="btn" id="af-open">Open all</button> <b style="font-size:13px">Show only:</b> ${A.kinds.map(k => `<button class="af-kchip af-k af-k-${k.id}" data-kk="${k.id}">${esc(k.label)}</button>`).join("")}</div>
      <p class="hint">Indented means “called by the line above”. Click a line for its details and code. The path shown is one web message; a messaging app differs only at the start (see <a href="#howitworks" data-go="doors">Who starts it</a>).</p>
      ${A.trace.map(step).join("")}`;
    let on = null, open = false;
    $(".toolbar", el).onclick = e => {
      if (e.target.id === "af-open") { open = !open; $$(".af-step", el).forEach(d => { d.open = open; }); e.target.textContent = open ? "Close all" : "Open all"; return; }
      const b = e.target.closest("[data-kk]"); if (!b) return;
      on = on === b.dataset.kk ? null : b.dataset.kk;
      $$("[data-kk]", el).forEach(x => x.classList.toggle("on", x.dataset.kk === on));
      $$(".af-step", el).forEach(d => d.classList.toggle("dim", !!on && d.dataset.k !== on));
    };
  },

  replay(el) {
    const A = this.AF, S = A.replay;
    let at = 0;
    el.innerHTML = `
      <div class="toolbar"><button class="btn" id="af-back">← Back</button><button class="btn on" id="af-next">Next →</button><button class="btn" id="af-auto">▶ Play</button><button class="btn" id="af-reset">Restart</button><span class="hint" style="margin:0">${esc(A.replayNote)}</span></div>
      <div class="af-play"><div class="af-lanes" id="af-lanes"></div><div class="panel" id="af-rp"></div></div>`;
    const dir = (a, b) => a === b ? "•" : a < b ? "→" : "←";
    const draw = () => {
      let html = A.lanes.map(l => `<div class="af-lane">${esc(l)}</div>`).join(""), turn = 0;
      S.slice(0, at + 1).forEach((s, i) => {
        if (s.t !== turn) { turn = s.t; html += `<div class="af-turn">Turn ${turn}</div>`; }
        const lo = Math.min(s.a, s.b), hi = Math.max(s.a, s.b);
        html += `<div class="af-bar${i === at ? " now" : ""}" style="grid-column:${lo + 1} / ${hi + 2}"><span class="dir">${dir(s.a, s.b)}</span>${esc(s.title)}</div>`;
      });
      const box = $("#af-lanes");
      box.innerHTML = html;
      $(".af-bar.now", box).scrollIntoView({ block: "nearest" });
      const s = S[at];
      const last = key => { for (let i = at; i >= 0; i--) if (S[i][key] !== undefined) return S[i][key]; return null; };
      const added = last("added") || [];
      $("#af-rp").innerHTML = `<div class="hint">Step ${at + 1} of ${S.length}, turn ${s.t}</div><h3>${esc(s.title)}</h3><p>${fmt(s.note)}</p>
        ${s.db ? `<span class="af-db">🗄 ${esc(s.db)}</span>` : ""}${file(s.file)}<span class="chip file">ƒ ${esc(s.fn)}</span>
        <h3>conversations.state</h3><pre>${esc(JSON.stringify(last("state"), null, 1))}</pre>
        <h3>Messages this turn adds</h3>${added.length ? added.map(m => `<div class="af-msg">${esc(m)}</div>`).join("") : `<p class="empty">None yet.</p>`}`;
      $("#af-back").disabled = at === 0;
      $("#af-next").disabled = at === S.length - 1;
    };
    const stop = () => { clearInterval(this.timer); $("#af-auto").textContent = "▶ Play"; };
    const move = n => { at = Math.max(0, Math.min(S.length - 1, at + n)); draw(); };
    $("#af-next").onclick = () => { stop(); move(1); };
    $("#af-back").onclick = () => { stop(); move(-1); };
    $("#af-reset").onclick = () => { stop(); at = 0; draw(); };
    $("#af-auto").onclick = e => {
      if (e.target.textContent.includes("Pause")) return stop();
      e.target.textContent = "❚❚ Pause";
      this.timer = setInterval(() => { if (at === S.length - 1) stop(); else move(1); }, 3500);
    };
    draw();
  },

  tools(el) {
    const A = this.AF;
    const rows = TL.tools.map(t => {
      const db = A.toolTables[t.name] || {};
      return `<tr><td><code>${esc(t.name)}</code></td><td>${esc(t.desk)}</td><td>${esc(t.purpose)}</td><td>${t.confirm ? "yes" : ""}</td><td>${esc(db.reads || "none")}</td><td>${esc(db.writes || "none")}</td><td>${esc(t.timeout)} s</td></tr>`;
    }).join("");
    el.innerHTML = `
      <div class="af-call"><b>Tools are not saved in the database.</b> A tool is a Python constant. Every turn, <code>tools_for()</code> picks a list, and the model is told about it again. Only the <i>use</i> of a tool is saved.</div>
      <h3 class="af-sec">The life of a tool</h3>
      <div class="af-life">${A.toolLife.map((s, i) => `<div><span class="num">${i + 1}</span><b>${esc(s.n)}</b><i>${esc(s.t)}</i><br>${fmt(s.d)}</div>`).join("")}</div>
      <h3 class="af-sec">A whole, real tool: <code>remember</code></h3>
      <pre style="max-height:none">${esc(A.toolCode)}</pre>
      <h3 class="af-sec">Where a tool's result goes</h3>
      <div class="af-stage"><div class="hint">A tool returns one <code>ToolResult</code>. <code>run_turn()</code> sends each field to a different place.</div>
      ${A.toolResult.map(r => `<div class="af-route"><span class="fld">${esc(r.f)}</span><span class="a">→</span><b>${esc(r.to)}</b><span>${fmt(r.how)}</span></div>`).join("")}</div>
      <h3 class="af-sec">What's kept, and where</h3>
      <table class="grid">${A.toolStored.map(r => `<tr><td>${fmt(r.what)}</td><td>${fmt(r.where)}</td></tr>`).join("")}</table>
      <h3 class="af-sec">Every tool, and the tables it touches</h3>
      <p class="hint">“Read-back” means the save needs an earlier yes. More on each tool: <a href="#agents">Agents &amp; tools</a>. The full gate as a chart: <a href="#" id="af-gate">Writing tool</a>.</p>
      <table class="grid"><tr><th>Tool</th><th>Group</th><th>What it does</th><th>Read-back</th><th>Reads</th><th>Writes</th><th>Time limit</th></tr>${rows}</table>
      <h3 class="af-sec">To add a tool</h3>
      <ol class="af-box" style="padding-left:30px">${A.toolAdd.map(s => `<li>${fmt(s)}</li>`).join("")}</ol>`;
    $("#af-gate").onclick = e => { e.preventDefault(); go("triggers", { chart: "writing-tool" }); };
  },

  db(el) {
    const A = this.AF;
    const NAMES = { R: "reads", W: "writes", RW: "reads and writes" };
    const cell = (r, s) => { const c = r.c[s]; return `<td>${c ? `<button class="af-cell ${c[0]}" data-w="${esc(c[1])}" data-t="${esc(r.t)}" data-o="${c[0]}" data-s="${s}">${c[0]}</button>` : ""}</td>`; };
    el.innerHTML = `
      <div class="af-call">Sessions are short: each query opens one and closes it right away. <b>No transaction stays open while the model thinks.</b></div>
      <h3 class="af-sec">Which table, at which moment <span class="hint">(click a cell)</span></h3>
      <div style="overflow-x:auto"><table class="grid af-matrix"><tr><th>Table</th>${A.dbStages.map(s => `<th>${esc(s)}</th>`).join("")}</tr>${A.dbRows.map(r => `<tr><td>${esc(r.t)}</td>${A.dbStages.map(s => cell(r, s)).join("")}</tr>`).join("")}</table></div>
      <div class="caption" id="af-why"><span class="hint">R reads, W writes, RW does both. Click one to see which function does it.</span></div>
      <h3 class="af-sec">How the main tables connect</h3>
      <p class="hint">${fmt(A.erNote)}</p>
      <div class="mm" id="af-er"></div>
      <h3 class="af-sec">A real <code>conversations</code> row, after turn 1 of the replay</h3>
      <pre style="max-height:none">${esc(A.row)}</pre>
      <h3 class="af-sec">Row locks: where two things could collide</h3>
      <table class="grid"><tr><th>Where</th><th>What it locks</th><th>Why</th></tr>${A.locks.map(r => `<tr><td>${fmt(r.what)}</td><td>${fmt(r.lock)}</td><td>${fmt(r.why)}</td></tr>`).join("")}</table>
      <h3 class="af-sec">Not in the database</h3>
      <table class="grid">${A.elsewhere.map(r => `<tr><td>${fmt(r.what)}</td><td>${fmt(r.where)}</td></tr>`).join("")}</table>`;
    $(".af-matrix", el).onclick = e => {
      const b = e.target.closest(".af-cell"); if (!b) return;
      $$(".af-cell", el).forEach(x => x.classList.toggle("pick", x === b));
      $("#af-why").innerHTML = `<b>${esc(b.dataset.s)}</b> ${NAMES[b.dataset.o]} <code>${esc(b.dataset.t)}</code>: ${fmt(b.dataset.w)}`;
    };
    drawMermaid($("#af-er"), A.er);
  },
});
</script>

<script>
// 1. System map: every module, agent, tool and external service as one Cytoscape graph.
register({
  id: "map", label: "System map",
  init() {
    const el = $("#v-map");
    el.innerHTML = `
      <div class="toolbar" id="map-types"></div>
      <div class="toolbar">
        <input type="search" id="map-q" placeholder="Find a node or file…" style="width:240px">
        <button class="btn" id="map-fit">Fit</button><button class="btn" id="map-clear">Clear</button>
        <span class="hint" style="margin:0">Hover to see connections · click for details · scroll to zoom · drag to pan</span>
      </div>
      <div class="layout"><div class="stage"><div class="cy" id="map-cy"></div></div>
      <div class="panel" id="map-panel"><p class="empty">Click a node.</p></div></div>`;
    const hidden = new Set();
    $("#map-types").innerHTML = TYPES.map(t => `<button class="typechip" data-t="${t.id}" style="--tc:${typeColor(t.id)}"><i></i>${esc(t.label)}</button>`).join("");
    // positions: one band per type, wrapped at 9 per row
    const els = [], pos = {};
    let y = 0;
    for (const t of TYPES) {
      const ids = Object.keys(NODES).filter(id => NODES[id].type === t.id);
      for (let r = 0; r * 9 < ids.length; r++) {
        const row = ids.slice(r * 9, r * 9 + 9);
        row.forEach((id, i) => { pos[id] = { x: (i - (row.length - 1) / 2) * 140, y }; });
        y += 62;
      }
      y += 40;
    }
    for (const id in NODES) els.push({ ...nodeEl(id), position: pos[id] });
    const edges = [...M.edges];
    for (const a of AG.agents) for (const c of a.tools || []) edges.push({ source: a.id, target: c.tool, label: "calls" });
    for (const t of TL.tools) if (t.confirm) edges.push({ source: t.id, target: "r-guards", label: "confirm()" });
    edges.forEach((e, i) => {
      if (!NODES[e.source] || !NODES[e.target]) { console.warn("edge to unknown node", e); return; }
      els.push({ data: { id: "e" + i, source: e.source, target: e.target, label: e.label || "" }, classes: e.dashed ? "dashed" : "" });
    });
    const cy = this.cy = cytoscape({ container: $("#map-cy"), elements: els, layout: { name: "preset" }, style: cyBaseStyle(), minZoom: 0.1, maxZoom: 3 });
    cy.fit(undefined, 20);
    const clear = () => { cy.elements().removeClass("faded lit pick hl"); };
    const focus = n => { clear(); const hood = n.closedNeighborhood(); cy.elements().not(hood).addClass("faded"); hood.addClass("lit"); n.addClass("pick"); };
    this.pick = id => { const n = cy.getElementById(id); if (!n.length) return; focus(n); this.panel(id); cy.animate({ center: { eles: n }, zoom: Math.max(cy.zoom(), 0.9) }, { duration: 300 }); };
    cy.on("mouseover", "node", e => { if (!cy.$(".pick, .hl").length) { const h = e.target.closedNeighborhood(); cy.elements().not(h).addClass("faded"); h.addClass("lit"); } showTip(NODES[e.target.id()].file || "(no file)", e.originalEvent); });
    cy.on("mouseout", "node", () => { hideTip(); if (!cy.$(".pick, .hl").length) cy.elements().removeClass("faded lit"); });
    cy.on("tap", "node", e => { focus(e.target); this.panel(e.target.id()); });
    cy.on("tap", e => { if (e.target === cy) { clear(); $("#map-panel").innerHTML = `<p class="empty">Click a node.</p>`; } });
    $("#map-types").onclick = e => {
      const b = e.target.closest(".typechip"); if (!b) return;
      const t = b.dataset.t; hidden.has(t) ? hidden.delete(t) : hidden.add(t);
      b.classList.toggle("off", hidden.has(t));
      cy.nodes().forEach(n => n.style("display", hidden.has(n.data("type")) ? "none" : "element"));
    };
    $("#map-q").oninput = e => {
      const q = e.target.value.trim().toLowerCase(); clear();
      if (!q) return;
      const hits = cy.nodes().filter(n => { const d = NODES[n.id()]; return [d.label, d.name, d.file, d.purpose, n.id()].join(" ").toLowerCase().includes(q); });
      cy.elements().not(hits).addClass("faded"); hits.addClass("hl");
      if (hits.length) cy.animate({ fit: { eles: hits, padding: 60 } }, { duration: 300 });
    };
    $("#map-fit").onclick = () => cy.animate({ fit: { padding: 20 } }, { duration: 300 });
    $("#map-clear").onclick = () => { clear(); $("#map-q").value = ""; cy.fit(undefined, 20); };
  },
  panel(id) {
    const n = NODES[id], cy = this.cy, node = cy.getElementById(id);
    const link = x => `<button class="chip" data-go="${esc(x)}" style="border-color:${typeColor(NODES[x]?.type)}">${esc(label(x))}</button>`;
    const outs = node.outgoers("node").map(x => x.id()), ins = node.incomers("node").map(x => x.id());
    const type = TYPES.find(t => t.id === n.type);
    $("#map-panel").innerHTML = `
      <h3>${esc(label(id))}${uv(n)}</h3>
      <span class="chip" style="border-color:${typeColor(n.type)}">${esc(type ? type.label : n.type)}</span>
      <p>${fmt(n.purpose || "")}</p>
      ${file(n.file)}${n.fn ? `<span class="chip file">ƒ ${esc(n.fn)}</span>` : ""}
      <div class="kv"><div>Inputs</div><div>${fmt(n.inputs || (n.inputs_list || []).join(", ") || "—")}</div>
      <div>Outputs</div><div>${fmt(n.outputs || "—")}</div></div>
      ${n.unverified && n.unverified !== true ? `<p class="hint">⚠ ${fmt(n.unverified)}</p>` : ""}
      <h3>Calls / feeds (${outs.length})</h3><div>${outs.map(link).join("") || "—"}</div>
      <h3>Called by (${ins.length})</h3><div>${ins.map(link).join("") || "—"}</div>
      ${n.type === "tool" ? `<p><button class="btn" onclick="go('agents',{node:'${id}'})">Open in agent ↔ tool network →</button></p>` : ""}
      ${n.type === "agent" ? `<p><button class="btn" onclick="go('agents',{node:'${id}'})">Its tools →</button></p>` : ""}`;
    $("#map-panel").onclick = e => { const b = e.target.closest("[data-go]"); if (b) this.pick(b.dataset.go); };
  },
  show(arg) {
    const cy = this.cy;
    setTimeout(() => { cy.resize(); if (!arg.node && !arg.nodes && !this.fitted) { cy.fit(undefined, 20); this.fitted = true; } }, 0);
    if (arg.node) this.pick(arg.node);
    if (arg.nodes) {
      cy.elements().removeClass("faded lit pick hl");
      const set = cy.collection(arg.nodes.map(id => cy.getElementById(id)).filter(n => n.length).reduce((a, n) => a.concat(n), []));
      const between = set.edgesWith(set);
      cy.elements().not(set.union(between)).addClass("faded"); set.addClass("hl"); between.addClass("lit");
      setTimeout(() => cy.animate({ fit: { eles: set, padding: 70 } }, { duration: 400 }), 30);
      $("#map-panel").innerHTML = `<h3>${esc(arg.title || "Highlighted")}</h3><p class="hint">${set.length} nodes involved:</p>` +
        arg.nodes.map(id => `<button class="chip" data-go="${esc(id)}">${esc(label(id))}</button>`).join("");
      $("#map-panel").onclick = e => { const b = e.target.closest("[data-go]"); if (b) this.pick(b.dataset.go); };
    }
  },
  onTheme() { this.cy.style(cyBaseStyle()); this.cy.nodes().forEach(n => n.data("color", typeColor(n.data("type")))); },
});
</script>

<!-- SECTION:view-flow-player START -->
<script>
// 2. Data flow player: one user action at a time, step by step, on its own small graph.
register({
  id: "flows", label: "Data flow player",
  init() {
    $("#v-flows").innerHTML = `
      <div class="toolbar" id="fl-list"></div>
      <div class="toolbar">
        <button class="btn" id="fl-back">◀ Back</button><button class="btn" id="fl-play">▶ Play</button>
        <button class="btn" id="fl-next">Next ▶</button><button class="btn" id="fl-reset">⟲ Reset</button>
        <span class="hint" style="margin:0">← → keys step · click a node for the system map</span>
      </div>
      <div class="caption" id="fl-cap"></div>
      <div class="stage" style="height:calc(100vh - 330px)"><div class="cy" id="fl-cy"></div></div>
      <div class="steps" id="fl-steps"></div>`;
    $("#fl-list").innerHTML = FL.flows.map(f => `<button class="btn" data-f="${f.id}">${esc(f.title)}${f.unverified ? " ⚠" : ""}</button>`).join("");
    $("#fl-list").onclick = e => { const b = e.target.closest("[data-f]"); if (b) this.load(b.dataset.f); };
    $("#fl-next").onclick = () => this.step(this.i + 1);
    $("#fl-back").onclick = () => this.step(this.i - 1);
    $("#fl-reset").onclick = () => { this.stop(); this.step(-1); };
    $("#fl-play").onclick = () => this.timer ? this.stop() : this.play();
    $("#fl-steps").onclick = e => { const b = e.target.closest("[data-i]"); if (b) { this.stop(); this.step(+b.dataset.i); } };
    addEventListener("keydown", e => {
      if (current !== this || e.target.matches("input, select, textarea")) return;
      if (e.key === "ArrowRight") this.step(this.i + 1);
      if (e.key === "ArrowLeft") this.step(this.i - 1);
    });
    this.load(FL.flows[0].id);
  },
  load(id) {
    this.stop();
    const f = this.flow = FL.flows.find(x => x.id === id) || FL.flows[0];
    $$("#fl-list .btn").forEach(b => b.classList.toggle("on", b.dataset.f === f.id));
    const order = [];
    for (const s of f.steps) for (const n of [s.from, s.to]) if (!order.includes(n)) order.push(n);
    // a snake of rows, 5 nodes each, in the order the flow first reaches them
    const per = 5, place = i => { const r = Math.floor(i / per), c = i % per; return { x: (r % 2 ? per - 1 - c : c) * 175, y: r * 115 + (c % 2) * 18 }; };
    const els = order.map((id, i) => ({ ...nodeEl(id), position: place(i) }));
    f.steps.forEach((s, i) => els.push({ data: { id: "s" + i, source: s.from, target: s.to, label: String(i + 1) } }));
    if (this.cy) this.cy.destroy();
    const cy = this.cy = cytoscape({ container: $("#fl-cy"), elements: els, layout: { name: "preset" }, style: [...cyBaseStyle(),
      { selector: "edge", style: { "label": "data(label)", "font-size": 10 } },
      { selector: "edge.done", style: { "line-color": css("--accent-soft"), "target-arrow-color": css("--accent-soft"), "width": 2 } },
      { selector: "edge.now", style: { "line-color": css("--accent"), "target-arrow-color": css("--accent"), "width": 5, "font-size": 13, "color": css("--accent"), "z-index": 9 } },
      { selector: "node.now", style: { "background-color": "data(color)", "color": css("--bg"), "border-width": 4 } },
      { selector: "node.past", style: { "border-width": 3 } },
    ] });
    cy.fit(undefined, 30); this.fitZoom = cy.zoom();
    cy.on("tap", "node", e => go("map", { node: e.target.id() }));
    cy.on("mouseover", "node", e => showTip(NODES[e.target.id()]?.file || "", e.originalEvent));
    cy.on("mouseout", "node", hideTip);
    $("#fl-steps").innerHTML = f.steps.map((s, i) => `<button data-i="${i}" title="${esc(label(s.from))} → ${esc(label(s.to))}">${i + 1}</button>`).join("");
    this.step(-1);
  },
  step(i) {
    const f = this.flow, cy = this.cy;
    i = Math.max(-1, Math.min(i, f.steps.length - 1));
    this.i = i;
    cy.elements().removeClass("now done past faded");
    $$("#fl-steps button").forEach((b, k) => { b.classList.toggle("now", k === i); b.classList.toggle("done", k < i); });
    if (i < 0) {
      cy.animate({ fit: { padding: 30 } }, { duration: 300 });
      $("#fl-cap").innerHTML = `<b>${esc(f.title)}</b>${uv(f)}<div>${fmt(f.summary)}</div><div class="n">${f.steps.length} steps · press Play or Next</div>`;
      return;
    }
    f.steps.forEach((s, k) => { if (k < i) { cy.$id("s" + k).addClass("done"); cy.$id(s.from).addClass("past"); cy.$id(s.to).addClass("past"); } });
    const s = f.steps[i], edge = cy.$id("s" + i);
    edge.addClass("now"); cy.$id(s.from).addClass("now"); cy.$id(s.to).addClass("now");
    const later = cy.nodes().filter(n => !n.hasClass("now") && !n.hasClass("past"));
    later.addClass("faded");
    cy.animate({ center: { eles: edge.connectedNodes() }, zoom: Math.max(this.fitZoom || 1, 1) }, { duration: 350 });
    $("#fl-cap").innerHTML = `<div class="n">Step ${i + 1} / ${f.steps.length} · ${esc(label(s.from))} → ${esc(label(s.to))}</div>
      <div><b>${fmt(s.data)}</b></div>${s.note ? `<div class="hint" style="margin:2px 0">${fmt(s.note)}</div>` : ""}
      <div>${file(s.file)}${s.fn ? `<span class="chip file">ƒ ${esc(s.fn)}</span>` : ""}${uv(s)}</div>`;
  },
  play() {
    if (this.i >= this.flow.steps.length - 1) this.step(-1);
    $("#fl-play").textContent = "⏸ Pause"; $("#fl-play").classList.add("on");
    this.timer = setInterval(() => { if (this.i >= this.flow.steps.length - 1) return this.stop(); this.step(this.i + 1); }, 2200);
  },
  stop() { clearInterval(this.timer); this.timer = null; const b = $("#fl-play"); if (b) { b.textContent = "▶ Play"; b.classList.remove("on"); } },
  show(arg) {
    setTimeout(() => { this.cy.resize(); this.cy.fit(undefined, 30); this.fitZoom = this.cy.zoom(); }, 0);
    if (arg.flow) { this.load(arg.flow); if (arg.step != null) this.step(arg.step); }
  },
  onTheme() { const i = this.i; this.load(this.flow.id); this.step(i); },
});
</script>

<script>
// 3. Agent ↔ tool network: which agent (desk) gets which tool, and which tools need the read-back yes.
register({
  id: "agents", label: "Agent ↔ tools",
  init() {
    $("#v-agents").innerHTML = `
      <p class="hint">Agents on the left, their tools in the middle (grouped by owner), the commit judge on the right. Dashed edge: only under a condition. Click an edge for when and why.</p>
      <div class="layout"><div class="stage"><div class="cy" id="ag-cy"></div></div>
      <div class="panel" id="ag-panel"><p class="empty">Click an edge or a node.</p></div></div>`;
    const els = [], groups = TL.groups;  // [{id, label}]
    const agents = AG.agents.filter(a => a.id !== "ag-judge");
    agents.forEach((a, i) => els.push({ ...nodeEl(a.id), position: { x: 0, y: i * 95 } }));
    let y = 0;
    for (const g of groups) {
      const tools = TL.tools.filter(t => t.desk === g.id);
      tools.forEach(t => { els.push({ ...nodeEl(t.id), position: { x: 330, y } }); y += 40; });
      y += 26;
    }
    const mid = (y - 26) / 2;
    agents.forEach((a, i) => { els[i].position.y = mid - ((agents.length - 1) * 95) / 2 + i * 95; });
    els.push({ ...nodeEl("ag-judge"), position: { x: 680, y: mid } });
    this.edges = {};
    for (const a of agents) for (const c of a.tools || []) {
      const id = a.id + ">" + c.tool;
      this.edges[id] = { ...c, agent: a.id };
      els.push({ data: { id, source: a.id, target: c.tool, label: c.condition ? "if…" : "" }, classes: c.condition ? "dashed" : "" });
    }
    for (const t of TL.tools) if (t.confirm) {
      const id = t.id + ">ag-judge";
      this.edges[id] = { tool: t.id, agent: "ag-judge", when: t.confirm.when, why: t.confirm.why, judge: true };
      els.push({ data: { id, source: t.id, target: "ag-judge", label: "" } });
    }
    const uniq = els;
    const cy = this.cy = cytoscape({ container: $("#ag-cy"), elements: uniq, layout: { name: "preset" },
      style: [...cyBaseStyle(), { selector: "edge", style: { "width": 1.6, "line-color": css("--t-agent"), "target-arrow-color": css("--t-agent"), "opacity": 0.55 } },
        { selector: "edge.dashed", style: { "line-style": "dashed" } },
        { selector: "edge.pickE", style: { "width": 4, "line-color": css("--accent"), "target-arrow-color": css("--accent"), "opacity": 1 } }, { selector: ".faded", style: { "opacity": 0.1 } }] });
    cy.fit(undefined, 20);
    cy.on("mouseover", "node", e => { const h = e.target.closedNeighborhood(); cy.elements().not(h).addClass("faded"); showTip(NODES[e.target.id()]?.file || "", e.originalEvent); });
    cy.on("mouseout", "node", () => { hideTip(); if (!cy.$(".pickE, .pick").length) cy.elements().removeClass("faded"); });
    cy.on("tap", "edge", e => this.pickEdge(e.target.id()));
    cy.on("tap", "node", e => this.pickNode(e.target.id()));
  },
  pickEdge(id) {
    const cy = this.cy, e = this.edges[id]; if (!e) return;
    cy.elements().removeClass("faded pickE pick");
    const edge = cy.$id(id); edge.addClass("pickE"); cy.elements().not(edge.union(edge.connectedNodes())).addClass("faded");
    const tool = NODES[e.tool];
    $("#ag-panel").innerHTML = `<h3>${esc(label(e.agent === "ag-judge" ? e.tool : e.agent))} → ${esc(label(e.agent === "ag-judge" ? "ag-judge" : e.tool))}</h3>
      ${e.condition ? `<p><span class="chip" style="border-style:dashed">only if: ${fmt(e.condition)}</span></p>` : ""}
      <div class="kv"><div>When</div><div>${fmt(e.when || "")}</div><div>Why</div><div>${fmt(e.why || "")}</div></div>
      ${file(tool.file)}<span class="chip file">ƒ ${esc(tool.fn)}</span>
      ${e.judge ? file("src/heydesk/runtime/guards.py") + `<span class="chip file">ƒ confirm</span>` : file(NODES[e.agent]?.file)}
      <p><button class="btn" data-n="${e.tool}">Tool details</button></p>`;
    $("#ag-panel").onclick = ev => { const b = ev.target.closest("[data-n]"); if (b) this.pickNode(b.dataset.n); };
  },
  pickNode(id) {
    const cy = this.cy, n = NODES[id];
    cy.elements().removeClass("faded pickE pick");
    const h = cy.$id(id).closedNeighborhood(); cy.elements().not(h).addClass("faded"); cy.$id(id).addClass("pick");
    let body = "";
    if (n.type === "tool") {
      body = `<p>${fmt(n.purpose)}</p>
        <div class="kv"><div>Writes?</div><div>${n.writes ? "yes — needs a read-back and a clear yes" : "no"}</div>
        <div>Shown</div><div>${n.label_web ? "web: “" + esc(n.label_web) + "”" : "—"}${n.filler ? "<br>voice: “" + esc(n.filler) + "”" : ""}</div>
        <div>Timeout</div><div>${n.timeout}s</div></div>
        <h3>Inputs</h3><table class="vars"><tr><th>arg</th><th>meaning</th></tr>${(n.inputs || []).map(i => `<tr><td><code>${esc(i[0])}</code></td><td>${fmt(i[1])}</td></tr>`).join("")}</table>
        <h3>Outputs</h3><ul>${(n.outputs || []).map(o => `<li>${fmt(o)}</li>`).join("")}</ul>
        <h3>Side effects</h3><ul>${(n.effects || []).map(o => `<li>${fmt(o)}</li>`).join("") || "<li>none</li>"}</ul>
        <h3>Description the model reads</h3><pre>${esc(n.description)}</pre>`;
    } else {
      body = `<p>${fmt(n.purpose)}</p>`;
    }
    $("#ag-panel").innerHTML = `<h3>${esc(label(id))}${uv(n)}</h3>${file(n.file)}${n.fn ? `<span class="chip file">ƒ ${esc(n.fn)}</span>` : ""}${body}
      <p><button class="btn" onclick="go('map',{node:'${id}'})">On the system map →</button></p>`;
  },
  show(arg) {
    setTimeout(() => { this.cy.resize(); this.cy.fit(undefined, 20); }, 0);
    if (arg.edge) this.pickEdge(arg.edge);
    if (arg.node) this.pickNode(arg.node);
  },
  onTheme() { this.cy.style([...cyBaseStyle(), { selector: "edge", style: { "width": 1.6, "line-color": css("--t-agent"), "target-arrow-color": css("--t-agent"), "opacity": 0.55 } }, { selector: "edge.dashed", style: { "line-style": "dashed" } }, { selector: "edge.pickE", style: { "width": 4, "line-color": css("--accent"), "target-arrow-color": css("--accent"), "opacity": 1 } }, { selector: ".faded", style: { "opacity": 0.1 } }]); this.cy.nodes().forEach(n => n.data("color", typeColor(n.data("type")))); },
});
</script>

<script>
// 4. Prompt assembly simulator: every prompt as stacked fragments; the controls decide which go in.
register({
  id: "prompts", label: "Prompt simulator",
  init() {
    this.state = {};
    for (const c of PR.controls) this.state[c.id] = c.default;
    this.prompt = PR.prompts[0].id;
    $("#v-prompts").innerHTML = `<div class="psim"><div class="ctl" id="ps-ctl"></div><div><div id="ps-head"></div><div id="ps-stack"></div></div><div class="panel" id="ps-out"></div></div>`;
    $("#ps-ctl").addEventListener("change", e => {
      const id = e.target.dataset.c; if (!id) return;
      if (id === "__prompt") this.prompt = e.target.value;
      else this.state[id] = e.target.type === "checkbox" ? e.target.checked : e.target.value;
      this.render(true);
    });
    $("#ps-stack").onclick = e => { const h = e.target.closest(".fh"); if (h) h.parentElement.classList.toggle("open"); };
    this.render(false);
  },
  test(when) {  // {control: value | [values] | true/false}; every one must hold. Returns the first that fails.
    for (const [k, want] of Object.entries(when || {})) {
      if (k === "$any") { if (want.some(w => !this.test(w))) continue; return "none of: " + want.map(w => Object.keys(w)[0]).join(" / "); }
      const have = this.state[k];
      const ok = Array.isArray(want) ? want.includes(have) : have === want;
      if (!ok) { const c = PR.controls.find(x => x.id === k); return `${c ? c.label : k} ${Array.isArray(want) ? "∈ " + want.join("/") : "= " + want}`; }
    }
    return null;
  },
  render(animate) {
    const p = PR.prompts.find(x => x.id === this.prompt);
    const visible = c => (!c.prompts || c.prompts.includes(p.id)) && !this.test(c.show);
    let groups = {}, html = `<div class="grp">Prompt</div><select data-c="__prompt">${PR.prompts.map(x => `<option value="${x.id}" ${x.id === p.id ? "selected" : ""}>${esc(x.title)}</option>`).join("")}</select>`;
    for (const c of PR.controls.filter(visible)) (groups[c.group] ||= []).push(c);
    for (const [g, cs] of Object.entries(groups)) {
      html += `<div class="grp">${esc(g)}</div>`;
      for (const c of cs) html += c.type === "select"
        ? `<label style="display:block">${esc(c.label)}<select data-c="${c.id}">${c.options.map(o => `<option ${o === this.state[c.id] ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></label>`
        : `<label title="${esc(c.help || "")}"><input type="checkbox" data-c="${c.id}" ${this.state[c.id] ? "checked" : ""}> <span>${esc(c.label)}${c.help ? `<br><small style="color:var(--muted)">${esc(c.help)}</small>` : ""}</span></label>`;
    }
    $("#ps-ctl").innerHTML = html;
    const before = this.included || new Set();
    const incl = new Set(); let n = 0;
    $("#ps-head").innerHTML = `<h2>${esc(p.title)}${uv(p)}</h2><p class="hint">${fmt(p.purpose)} ${file(p.file)}</p>`;
    $("#ps-stack").innerHTML = p.fragments.map(f => {
      const fail = this.test(f.when);
      if (!fail) incl.add(f.id);
      return `<div class="frag ${fail ? "out" : "in"}" data-f="${f.id}">
        <div class="fh own-${f.owner}"><span class="ord">${fail ? "–" : ++n}</span><b>${esc(f.title)}</b>${uv(f)}
          <span class="why">${fail ? "left out: " + esc(fail) : esc(f.owner_label || PR.owners[f.owner])}</span></div>
        <div class="fb">${f.note ? `<p class="hint">${fmt(f.note)}</p>` : ""}${file(f.file)}${f.fn ? `<span class="chip file">ƒ ${esc(f.fn)}</span>` : ""}
          ${f.when ? `<div class="hint">Included when: ${Object.entries(f.when).map(([k, v]) => `<code>${esc(k)} = ${esc(JSON.stringify(v))}</code>`).join(" and ")}</div>` : `<div class="hint">Always included.</div>`}
          <pre>${esc(f.text)}</pre></div></div>`;
    }).join("");
    if (animate) for (const id of incl) if (!before.has(id)) { const el = $(`#ps-stack [data-f="${id}"]`); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 400); }
    this.included = incl;
    const used = p.fragments.filter(f => incl.has(f.id));
    const vars = used.flatMap(f => (f.vars || []).map(v => [f.title, ...v]));
    $("#ps-out").innerHTML = `<h3>Final order (${used.length} of ${p.fragments.length})</h3>
      <ol class="order">${used.map(f => `<li><span class="chip own-${f.owner}">${esc(PR.owners[f.owner])}</span>${esc(f.title)}</li>`).join("")}</ol>
      <h3>What fills each variable</h3>
      ${vars.length ? `<table class="vars"><tr><th>fragment</th><th>variable</th><th>filled by</th></tr>${vars.map(v => `<tr><td>${esc(v[0])}</td><td><code>${esc(v[1])}</code></td><td>${fmt(v[2])}</td></tr>`).join("")}</table>` : `<p class="empty">No variables in the included fragments.</p>`}
      <h3>Who owns each colour</h3>${Object.entries(PR.owners).map(([k, v]) => `<span class="chip own-${k}">${esc(v)}</span>`).join("")}
      <h3>Trigger</h3><p>${fmt(p.trigger)}</p>`;
  },
  show(arg) {
    if (arg.prompt) this.prompt = arg.prompt;
    if (arg.set) Object.assign(this.state, arg.set);
    this.render(true);
    if (arg.frag) { const el = $(`#ps-stack [data-f="${arg.frag}"]`); if (el) { el.classList.add("open"); el.scrollIntoView({ block: "center", behavior: "smooth" }); } }
  },
});
</script>
<!-- SECTION:view-prompt-simulator END -->

<!-- SECTION:view-triggers START -->
<script>
// 5. Trigger & condition flowcharts (Mermaid). Clicking a node shows its condition code.
register({
  id: "triggers", label: "Triggers & conditions",
  init() {
    $("#v-triggers").innerHTML = `<div class="toolbar" id="tr-list"></div>
      <div class="layout"><div><p class="hint" id="tr-hint"></p><div class="mm" id="tr-mm"></div></div><div class="panel" id="tr-panel"><p class="empty">Click a box in the chart.</p></div></div>`;
    $("#tr-list").innerHTML = TR.charts.map(c => `<button class="btn" data-c="${c.id}" title="${esc(c.kind)}">${esc(c.title)}</button>`).join("");
    $("#tr-list").onclick = e => { const b = e.target.closest("[data-c]"); if (b) this.load(b.dataset.c); };
    this.load(TR.charts[0].id);
  },
  async load(id, pick) {
    const c = this.chart = TR.charts.find(x => x.id === id) || TR.charts[0];
    $$("#tr-list .btn").forEach(b => b.classList.toggle("on", b.dataset.c === c.id));
    $("#tr-hint").innerHTML = `<span class="chip">${esc(c.kind)}</span> ${fmt(c.summary)} ${file(c.file)}`;
    const key = {}; c.nodes.forEach((n, i) => { key[n.id] = "n" + i; });
    const shape = (n) => { const t = mq(n.label); return { decision: `{{"${t}"}}`, event: `>"${t}"]`, loop: `[["${t}"]]`, end: `(["${t}"])`, fail: `["${t}"]` }[n.shape] || `["${t}"]`; };
    let text = "flowchart TD\n";
    for (const n of c.nodes) text += `  ${key[n.id]}${shape(n)}\n`;
    for (const [a, b, l] of c.edges) text += `  ${key[a]} -->${l ? `|"${mq(l)}"|` : ""} ${key[b]}\n`;
    text += "  classDef fail stroke:#dc2626,stroke-width:2px\n  classDef uv stroke-dasharray:5 4,stroke:#c2410c\n";
    for (const n of c.nodes) { if (n.shape === "fail") text += `  class ${key[n.id]} fail\n`; if (n.unverified) text += `  class ${key[n.id]} uv\n`; }
    await drawMermaid($("#tr-mm"), text);
    const back = Object.fromEntries(Object.entries(key).map(([a, b]) => [b, a]));
    $$("#tr-mm g.node").forEach(g => {
      const m = g.id.match(/^flowchart-(n\d+)-\d+$/); if (!m) return;
      g.dataset.n = back[m[1]];
      g.addEventListener("click", () => this.pick(g.dataset.n));
    });
    if (pick) this.pick(pick); else $("#tr-panel").innerHTML = `<p class="empty">Click a box in the chart.</p>`;
  },
  pick(id) {
    const n = this.chart.nodes.find(x => x.id === id); if (!n) return;
    $$("#tr-mm g.node").forEach(g => g.classList.toggle("picked", g.dataset.n === id));
    $("#tr-panel").innerHTML = `<h3>${esc(n.label)}${uv(n)}</h3>${n.note ? `<p>${fmt(n.note)}</p>` : ""}
      ${file(n.file || this.chart.file)}${n.fn ? `<span class="chip file">ƒ ${esc(n.fn)}</span>` : ""}
      ${n.code ? `<h3>Condition / code</h3><pre>${esc(n.code)}</pre>` : ""}`;
  },
  show(arg) { if (arg.chart) this.load(arg.chart, arg.node); },
  onTheme() { this.load(this.chart.id); },
});
</script>
<!-- SECTION:view-triggers END -->

<!-- SECTION:view-state-timeline START -->
<script>
// 6. State & sync: where state lives (table) and how it moves (Mermaid sequence diagrams).
register({
  id: "state", label: "State & sync",
  init() {
    $("#v-state").innerHTML = `<div class="toolbar" id="st-list"></div><p class="hint" id="st-hint"></p><div class="mm" id="st-mm"></div>
      <h3>Where state lives</h3><p class="hint">Click a row to open its timeline.</p><div id="st-table"></div>`;
    $("#st-list").innerHTML = ST.timelines.map(t => `<button class="btn" data-t="${t.id}">${esc(t.title)}</button>`).join("");
    $("#st-list").onclick = e => { const b = e.target.closest("[data-t]"); if (b) this.load(b.dataset.t); };
    $("#st-table").innerHTML = `<table class="grid"><tr><th>State</th><th>Lives in</th><th>Written by</th><th>Synced how / when</th><th>On failure</th></tr>${ST.places.map((p, i) =>
      `<tr data-i="${i}" ${p.timeline ? `style="cursor:pointer"` : ""}><td><b>${esc(p.what)}</b>${uv(p)}<br>${file(p.file)}</td><td>${fmt(p.where)}</td><td>${fmt(p.written)}</td><td>${fmt(p.sync)}</td><td>${fmt(p.failure)}</td></tr>`).join("")}</table>`;
    $("#st-table").onclick = e => { const r = e.target.closest("tr[data-i]"); if (!r) return; const p = ST.places[+r.dataset.i]; if (p.timeline) { this.load(p.timeline); scrollTo({ top: 0, behavior: "smooth" }); } };
    this.load(ST.timelines[0].id);
  },
  seq(steps, ind = "  ") {
    const arrow = { sync: "->>", ret: "-->>", fail: "-x", async: "-)", retry: "->>" };
    let out = "";
    for (const s of steps) {
      if (s.note) out += `${ind}Note over ${s.over.join(",")}: ${mq(s.note)}\n`;
      else if (s.alt) out += `${ind}alt ${mq(s.alt)}\n${this.seq(s.s, ind + "  ")}${s.else ? `${ind}else ${mq(s.else)}\n${this.seq(s.e, ind + "  ")}` : ""}${ind}end\n`;
      else if (s.loop) out += `${ind}loop ${mq(s.loop)}\n${this.seq(s.s, ind + "  ")}${ind}end\n`;
      else if (s.opt) out += `${ind}opt ${mq(s.opt)}\n${this.seq(s.s, ind + "  ")}${ind}end\n`;
      else out += `${ind}${s.f}${arrow[s.k || "sync"]}${s.t}: ${s.k === "retry" ? "↻ " : ""}${mq(s.m)}\n`;
    }
    return out;
  },
  async load(id) {
    const t = this.tl = ST.timelines.find(x => x.id === id) || ST.timelines[0];
    $$("#st-list .btn").forEach(b => b.classList.toggle("on", b.dataset.t === t.id));
    $$("#st-table tr[data-i]").forEach(r => r.classList.toggle("hl", ST.places[+r.dataset.i].timeline === t.id));
    $("#st-hint").innerHTML = `${fmt(t.summary)} ${(t.files || []).map(file).join("")}${uv(t)}`;
    const text = "sequenceDiagram\n  autonumber\n" + t.participants.map(([id, name]) => `  participant ${id} as ${mq(name)}\n`).join("") + this.seq(t.steps);
    await drawMermaid($("#st-mm"), text);
  },
  show(arg) { if (arg.timeline) this.load(arg.timeline); },
  onTheme() { this.load(this.tl.id); },
});
</script>
<!-- SECTION:view-state-timeline END -->

<!-- SECTION:view-solutions START -->
<script>
// 7. "How I solved it": one card per problem, each with a mini diagram and the nodes it touches.
register({
  id: "solved", label: "How I solved it",
  init() {
    $("#v-solved").innerHTML = `<p class="hint">Each card: the problem, what I did, why. “Show on map” lights up the parts involved.</p><div class="cards" id="so-cards"></div>`;
    $("#so-cards").innerHTML = SO.cards.map((c, i) => `<div class="card" id="so-${c.id}">
      <h3>${esc(c.title)}</h3><ul class="lines">${c.lines.map(l => `<li>${fmt(l)}</li>`).join("")}</ul>
      <div class="mm" id="so-mm-${i}"></div>
      <div>${(c.files || []).map(file).join("")}</div>
      <div class="row"><button class="btn" data-map="${i}">Show on map →</button>${c.flow ? `<button class="btn" data-flow="${i}">Play its flow →</button>` : ""}</div></div>`).join("");
    $("#so-cards").onclick = e => {
      const m = e.target.closest("[data-map]"), f = e.target.closest("[data-flow]");
      if (m) { const c = SO.cards[+m.dataset.map]; go("map", { nodes: c.nodes, title: c.title }); }
      if (f) go("flows", { flow: SO.cards[+f.dataset.flow].flow });
    };
    this.draw();
  },
  async draw() { for (let i = 0; i < SO.cards.length; i++) await drawMermaid($("#so-mm-" + i), SO.cards[i].diagram); },
  show(arg) {
    $$("#so-cards .card").forEach(c => c.classList.remove("hl"));
    if (arg.card) { const el = $("#so-" + arg.card); if (el) { el.classList.add("hl"); el.scrollIntoView({ block: "center", behavior: "smooth" }); } }
  },
  onTheme() { this.draw(); },
});
</script>
<!-- SECTION:view-solutions END -->

<!-- SECTION:view-quiz START -->
<script>
// 8. Mentor quiz: each question jumps to the view that answers it, with the answer on top.
register({
  id: "quiz", label: "Mentor quiz",
  init() {
    $("#v-quiz").innerHTML = `<div class="toolbar"><button class="btn" id="qz-shuffle">Shuffle</button><button class="btn" id="qz-reveal">Show all short answers</button><span class="hint" style="margin:0">Say your answer out loud, then click: it opens the view that proves it.</span></div><div class="cards" id="qz-cards"></div>`;
    this.order = QZ.questions.map((_, i) => i);
    this.reveal = false;
    $("#qz-shuffle").onclick = () => { this.order.sort(() => Math.random() - 0.5); this.draw(); };
    $("#qz-reveal").onclick = () => { this.reveal = !this.reveal; this.draw(); };
    $("#qz-cards").onclick = e => { const c = e.target.closest("[data-q]"); if (!c) return; const q = QZ.questions[+c.dataset.q]; go(q.go.view, { ...q.go.arg, quiz: +c.dataset.q }); };
    this.draw();
  },
  draw() {
    $("#qz-cards").innerHTML = this.order.map(i => { const q = QZ.questions[i]; const v = VIEWS.find(x => x.id === q.go.view);
      return `<div class="card q" data-q="${i}"><span class="num">Q${i + 1} · opens ${esc(v ? v.label : q.go.view)}</span><b>${fmt(q.q)}</b>${this.reveal ? `<span class="a">${fmt(q.a)}</span>` : ""}</div>`; }).join("");
  },
});
</script>
<!-- SECTION:view-quiz END -->

<!-- SECTION:view-findings START -->
<script>
// Extra: what looked broken, dead or inconsistent, and everything marked UNVERIFIED.
register({
  id: "findings", label: "Findings",
  init() {
    const uvs = [];
    for (const id in NODES) if (NODES[id].unverified) uvs.push([label(id), NODES[id].file, NODES[id].unverified, `go('map',{node:'${id}'})`]);
    for (const p of PR.prompts) { if (p.unverified) uvs.push([p.title, p.file, p.unverified, `go('prompts',{prompt:'${p.id}'})`]); for (const f of p.fragments) if (f.unverified) uvs.push([p.title + ": " + f.title, f.file, f.unverified, `go('prompts',{prompt:'${p.id}',frag:'${f.id}'})`]); }
    for (const f of FL.flows) if (f.unverified) uvs.push([f.title, "", f.unverified, `go('flows',{flow:'${f.id}'})`]);
    $("#v-findings").innerHTML = `<h2>Broken, dead or inconsistent</h2><p class="hint">Found while reading the code. Severity is my judgement.</p>
      <table class="grid"><tr><th>Sev.</th><th>Finding</th><th>Files</th></tr>${FD.items.map(f => `<tr><td><span class="sev ${f.sev}">${esc(f.sev)}</span></td><td><b>${esc(f.title)}</b><br>${fmt(f.detail)}</td><td>${(f.files || []).map(file).join("")}</td></tr>`).join("")}</table>
      <h2 style="margin-top:18px">UNVERIFIED (${uvs.length})</h2><p class="hint">Shown with a dashed outline elsewhere. Click to open.</p>
      <table class="grid"><tr><th>Item</th><th>Why it can't be confirmed from the code</th></tr>${uvs.map(u => `<tr style="cursor:pointer" onclick="${u[3]}"><td><b>${esc(u[0])}</b><br>${file(u[1])}</td><td>${fmt(u[2] === true ? "Not in this repository." : u[2])}</td></tr>`).join("")}</table>`;
  },
});
</script>
<!-- SECTION:view-findings END -->

route();
