[project]
name = "heydesk"
version = "0.1.0"
description = "Build, publish and run AI front-desk agents"
readme = "README.md"
authors = [
    { name = "kayesFerdous", email = "kayesfardows@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "fastapi>=0.142.1",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0",
    "typesafe-sdk>=0.7.2",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
heydesk = "heydesk.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls real providers (needs GROQ_API_KEY and TYPESAFE_API_KEY)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.format]
exclude = ["*.md"]  # the docs' code blocks are sketches, not formatted source

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]            # the layers whose guarantees are types: Confirmed[T], Protocols
module = ["heydesk.domain.*", "heydesk.ports.*", "heydesk.runtime.*", "heydesk.tools.*"]
strict = true
