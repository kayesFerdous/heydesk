# The jobs library (D32): what an agent can get a visitor done. Each kind of business (a preset)
# names the jobs it does, and the owner doesn't change them (D37). The tools follow from the jobs.
# `description` is for the owner, in plain words. Detail types: design §7.
order:
  label: pickup order
  description: Customers order from your menu and pick it up. The agent adds up the total and reads it back before saving.
  start_when: the visitor wants to order food or buy something
  details:                                # asked in this order; the visitor may give them in any order
    - {name: items,       type: cart}     # filled by update_order
    - {name: pickup_time, type: time_today,  ask: "What time would you like to pick it up?"}
    - {name: name,        type: person_name, ask: "What name should I put the order under?"}
    - {name: phone,       type: phone,       ask: "What's the best number to reach you?"}
    - {name: note,        type: text, required: false, ask: "Anything we should know?"}
  finish_with: place_order
appointment:
  label: appointment request
  description: Patients ask to see a doctor on a day the doctor works, inside the doctor's hours. Your team calls to confirm.
  start_when: the visitor wants to see a doctor or asks for an appointment
  details:
    - {name: doctor,           type: doctor,           ask: "Which doctor would you like to see?"}
    - {name: appointment_time, type: appointment_time, ask: "Which day and time suit you best?"}
    - {name: name,             type: person_name,      ask: "What is the name for the appointment?"}
    - {name: phone,            type: phone,            ask: "What's the best number to confirm on?"}
  finish_with: submit_request
message:
  label: message for the team
  description: Customers leave a message or ask for a call back, and you see it in your inbox.
  start_when: the visitor wants to leave a message, asks for a call back, or asks something you can't answer
  details:
    - {name: body,      type: text,        ask: "What would you like me to pass on?"}
    - {name: name,      type: person_name, ask: "Who should I say it's from?"}
    - {name: phone,     type: phone,       ask: "What's the best number to call you back on?"}
    - {name: best_time, type: text, required: false, ask: "Is there a good time to call?"}
  finish_with: submit_request
