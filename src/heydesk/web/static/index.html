<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="agent-key" content="__AGENT_KEY__">
<title>HeyDesk dev chat</title>
<style>
  :root {
    --bg: #fbfaf8; --panel: #fff; --ink: #1c1917; --dim: #78716c; --line: #e7e5e4;
    --accent: #0f766e; --on-accent: #fff; --bad: #b91c1c;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12110f; --panel: #1c1a17; --ink: #f5f5f4; --dim: #a8a29e; --line: #33302c;
            --accent: #5eead4; --on-accent: #12110f; --bad: #fca5a5; }
  }
  * { box-sizing: border-box }
  body { margin: 0; background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.5 }
  main { max-width: 640px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column;
         min-height: 100dvh }
  header { display: flex; justify-content: space-between; align-items: baseline;
           padding-bottom: 12px; border-bottom: 1px solid var(--line) }
  h1 { font-size: 15px; margin: 0; font-weight: 650 }
  button.link { background: none; border: 0; color: var(--dim); font: inherit; font-size: 13px;
                cursor: pointer; text-decoration: underline }
  #log { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 16px 0 }
  .msg { padding: 9px 13px; border-radius: 12px; max-width: 85%; white-space: pre-wrap;
         overflow-wrap: anywhere }
  .you { align-self: flex-end; background: var(--accent); color: var(--on-accent) }
  .agent { align-self: flex-start; background: var(--panel); border: 1px solid var(--line) }
  .card { align-self: stretch; background: var(--panel); border: 1px solid var(--accent);
          border-radius: 12px; padding: 10px 13px }
  .err { align-self: flex-start; color: var(--bad); font-size: 13px }
  .err button { margin-left: 8px }
  #waiting { color: var(--dim); font-size: 13px; min-height: 20px }
  .dots::after { content: "…"; animation: blink 1s steps(2) infinite }
  @keyframes blink { 50% { opacity: .2 } }
  form { display: flex; gap: 8px; position: sticky; bottom: 0; background: var(--bg);
         padding: 8px 0 }
  input { flex: 1; min-width: 0; padding: 11px 13px; border-radius: 10px; font: inherit;
          border: 1px solid var(--line); background: var(--panel); color: inherit }
  button { padding: 11px 15px; border-radius: 10px; font: inherit; cursor: pointer;
           border: 1px solid var(--line); background: var(--panel); color: inherit }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: transparent }
  button:disabled, input:disabled { opacity: .5; cursor: default }
</style>
</head>
<body>
<main>
  <header>
    <h1><span id="agent-name">HeyDesk</span> <span style="color: var(--dim); font-weight: 400">dev agent</span></h1>
    <span>
      <button id="call" type="button">Call</button>
      <button class="link" id="restart" type="button">Start over</button>
    </span>
  </header>
  <div id="log" aria-live="polite"></div>
  <div id="waiting"></div>
  <form id="form">
    <input id="input" autocomplete="off" autofocus placeholder="Type a message" aria-label="Message">
    <button class="primary" id="send">Send</button>
  </form>
</main>
<script src="chat.js" type="module"></script>
<script src="voice.js" type="module"></script>
</body>
</html>
