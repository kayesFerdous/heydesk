# A clinic agent (DEV_AGENT_KIND=clinic, DEV_AGENT_SEED=this file). Any field of the clinic's
# config may be set here (desks/clinic/__init__.py); what's left out has a default.
# Fees are in paisa: 80000 = ৳800. `days`, `start` and `end` (24-hour) say when a doctor sees
# patients; an appointment must fit them.
name: Lakeview Clinic front desk
business_name: Lakeview Clinic
timezone: Asia/Dhaka
currency: BDT
handoff:
  message: Let me get someone from the clinic to help you. You can also call us.
  phone: "+880 1900 000000"
address: "House 7, Road 3, Banani, Dhaka"
hours:
  sat: ["09:00", "21:00"]
  sun: ["09:00", "21:00"]
  mon: ["09:00", "21:00"]
  tue: ["09:00", "21:00"]
  wed: ["09:00", "21:00"]
  thu: ["09:00", "17:00"]
emergency_phone: "999"
policies: |
  Appointments are confirmed by a phone call from the front desk.
  Please bring earlier reports and a photo ID. Fees are paid at the clinic, by cash or card.
  We don't treat emergencies here: for those, call 999 or go to the nearest hospital.
