# The shop of shop.yaml with a Bangla greeting (D84, D86): DEV_AGENT_KIND=shop, DEV_AGENT_SEED=this
# file. Calls are in Bangla when VOICE_LANGUAGE is `bn`, and the local VITS voice drops Latin
# letters, so an English greeting would open its calls in silence.
greeting: আসসালামু আলাইকুম, নকশি থ্রেডসে আপনাকে স্বাগতম। আমি কীভাবে সাহায্য করতে পারি?
# Calls to confirm new orders (D89), on for the demo: {code} and {total} are said in Bangla words
calls:
  enabled: true
  wait_minutes: 0
  start: "08:00"
  end: "23:00"
  opening: আসসালামু আলাইকুম, আমি নকশি থ্রেডস থেকে বলছি। আপনার অর্ডার {code}, মোট {total}, ক্যাশ অন ডেলিভারি। অর্ডারটি কি কনফার্ম করে পাঠিয়ে দেবো?
name: Nakshi Threads assistant
business_name: Nakshi Threads
timezone: Asia/Dhaka
currency: BDT
handoff:
  message: Let me get someone from our team. You can also call or WhatsApp us.
  phone: "+880 1800 000000"
# Each area's places are what buyers say instead of its name: "Mirpur 10" is Inside Dhaka.
delivery:
  - {name: Inside Dhaka, charge: 6000, days: "1–2 days",
     places: [Mirpur, Uttara, Dhanmondi, Gulshan, Banani, Mohammadpur, Motijheel, Badda,
              Rampura, Bashundhara, Farmgate, Old Dhaka]}
  - {name: Dhaka suburbs, charge: 10000, days: "2–3 days",
     places: [Savar, Ashulia, Gazipur, Tongi, Keraniganj, Narayanganj]}
  - {name: Outside Dhaka, charge: 12000, days: "3–5 days", pay_first: true,
     places: [Chittagong, Chattogram, Sylhet, Khulna, Rajshahi, Barishal, Rangpur, Mymensingh,
              Cumilla, Comilla, Bogura]}
free_delivery_over: 300000
policies: |
  Check the parcel in front of the rider before paying. If something is wrong, don't take it.
  If you refuse a parcel that matches its photo, pay the delivery charge to the rider.
  A delivery charge paid first isn't refunded if you cancel.
  Exchange within 3 days for a different size, if the tag is on. No refunds on sale items.
exchange_days: 3  # the agent takes size or colour exchange requests this long after delivery
size_guide: |
  Panjabi, in inches (chest / length): M 40 / 42, L 42 / 43, XL 44 / 44, XXL 46 / 45.
  Kurti, chest in inches: S 36, M 38, L 40, XL 42.
  Kids Panjabi: by age, as the size says; take the bigger one if in between.
# The products: saved in the products table, not the config. No stock: not counted.
products:
  # Counted per size and colour (D56): M in any colour; L in White and Navy; XL in White. What
  # isn't listed (L Cream, XXL…) isn't counted.
  - {code: panjabi-cotton, name: Cotton Panjabi, price: 185000, category: Men,
     sizes: [M, L, XL, XXL], colours: [White, Cream, Navy],
     variants: [{size: M, stock: 4}, {size: L, colour: White, stock: 3},
                {size: L, colour: Navy, stock: 0}, {size: XL, colour: White, stock: 2}],
     description: "Soft cotton, embroidered collar. Fits true to size."}
  - {code: panjabi-silk, name: Silk Panjabi, price: 320000, category: Men,
     sizes: [M, L, XL], colours: [Maroon, Gold], stock: 2}
  - {code: three-piece, name: Lawn Three-Piece, price: 245000, was_price: 290000, category: Women,
     colours: [Peach, Mint, Sky Blue], stock: 8,
     description: "Unstitched kameez, salwar and dupatta, printed lawn."}
  - {code: jamdani-saree, name: Jamdani Saree, price: 650000, category: Women,
     colours: [Off-white, Red], stock: 0,
     description: "Handwoven in Narayanganj, 6 yards, with blouse piece."}
  - {code: kurti, name: Cotton Kurti, price: 95000, category: Women,
     sizes: [S, M, L, XL], colours: [Black, Mustard]}
  - {code: kids-panjabi, name: Kids Panjabi, price: 89000, category: Kids,
     sizes: ["2-3y", "4-5y", "6-7y", "8-9y"], colours: [White, Sky Blue]}
faq: |
  We are an online shop: no showroom. Orders placed before 5 pm inside Dhaka usually go out the
  same day.
